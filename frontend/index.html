<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LocalVision Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; padding: 30px; line-height: 1.6; }
        h1 { color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.3); }
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 40px; color: #bbb; }
        
        /* Face Grid */
        .face-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; min-height: 100px; }
        .face-wrapper { text-align: center; transition: transform 0.2s; }
        .face-wrapper:hover { transform: scale(1.1); }
        .face-thumb { width: 90px; height: 90px; object-fit: cover; border-radius: 50%; border: 3px solid #00d4ff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; }
        
        /* Photo Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border-radius: 12px; overflow: hidden; border: 1px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card img { width: 100%; height: 200px; object-fit: cover; display: block; }
        .card-info { padding: 12px; font-size: 0.85rem; background: #252525; }
        .filename { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #888; }
        
        .badge { background: #00d4ff; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; }
.person-card { background: #1e1e1e; border-radius: 16px; padding: 12px; text-align: center; width: 120px; }
.person-card img { width: 90px; height: 90px; object-fit: cover; border-radius: 50%; border: 3px solid #00d4ff; }
.person-info { margin-top: 10px; }
.person-name { width: 100%; border: 1px solid #444; border-radius: 10px; padding: 8px; background: #121212; color: #e0e0e0; }
.save-button { margin-top: 8px; width: 100%; border: none; border-radius: 10px; padding: 8px; background: #00d4ff; color: #000; font-weight: bold; cursor: pointer; }
.save-button:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1> LocalVision Engine</h1>

    <h2> People Found <span id="face-count" class="badge">0</span></h2>
    <div id="faces" class="face-grid"></div>

    <h2>📸 Gallery <span id="photo-count" class="badge">0</span></h2>
    <div id="gallery" class="grid"></div>

    <script>
        const API = location.origin;

        async function savePersonName(personId, name, button) {
            try {
                button.disabled = true;
                await fetch(`${API}/people/${personId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
            } catch (err) {
                console.error('Failed to save name:', err);
                alert('Unable to save name. Try again.');
            } finally {
                button.disabled = false;
            }
        }

        async function loadData() {
            try {
                const faceRes = await fetch(`${API}/people`);
                const faces = await faceRes.json();
                const faceContainer = document.getElementById('faces');
                document.getElementById('face-count').innerText = faces.length;

                if (faceContainer.children.length !== faces.length) {
                    faceContainer.innerHTML = '';
                    faces.forEach(person => {
                        const div = document.createElement('div');
                        div.className = 'person-card';

                        const cleanUrl = person.url.startsWith('/') ? person.url : `/${person.url}`;
                        div.innerHTML = `
                            <img src="${API}${cleanUrl}" alt="Person ${person.person_id}">
                            <div class="person-info">
                                <input class="person-name" type="text" value="${person.name}" placeholder="Name this person" />
                                <button class="save-button">Save</button>
                            </div>
                        `;

                        const input = div.querySelector('.person-name');
                        const button = div.querySelector('.save-button');

                        input.addEventListener('input', () => {
                            button.disabled = false;
                        });

                        button.addEventListener('click', () => {
                            if (!person.person_id) {
                                alert('Unable to rename an ungrouped face yet.');
                                return;
                            }
                            savePersonName(person.person_id, input.value.trim() || 'Unknown', button);
                        });

                        faceContainer.appendChild(div);
                    });
                }

                const photoRes = await fetch(`${API}/gallery`);
                const photos = await photoRes.json();
                const galleryContainer = document.getElementById('gallery');
                document.getElementById('photo-count').innerText = photos.length;

                if (galleryContainer.children.length !== photos.length) {
                    galleryContainer.innerHTML = '';
                    photos.forEach(photo => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <img src="${API}${photo.thumb_url}" alt="${photo.filename}">
                            <div class="card-info">
                                <div class="filename">${photo.filename}</div>
                            </div>
                        `;
                        galleryContainer.appendChild(card);
                    });
                }
            } catch (err) {
                console.error('Dashboard Sync Error:', err);
            }
        }

        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
